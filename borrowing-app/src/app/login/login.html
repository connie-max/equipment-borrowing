<!-- login.html — the login / register page, AUREL style. -->
<div class="max-w-md mx-auto p-6">
  <div class="bg-white border border-gray-200 rounded-3xl shadow p-6">
    <p class="text-xs font-bold tracking-widest text-gray-500 mb-2">BORROWING SYSTEM</p>
    <h1 class="text-3xl font-black mb-2">ENGINEERED<br>TO <span class="text-[#ff6b1a]">BORROW</span></h1>
    <p class="text-gray-600 mb-4">Log in to borrow equipment or a room.</p>

    <!-- Demo accounts, so the defence demo works straight away. -->
    <p class="bg-orange-50 border border-orange-100 p-3 rounded-xl mb-4 text-sm">
      Demo — Admin: admin&#64;school.ph / admin123<br>
      Demo — Borrower: anthony&#64;school.ph / borrower123
    </p>

    <label class="block mb-2" *ngIf="isRegistering">
      Name
      <input [(ngModel)]="name" class="block w-full border rounded-lg p-2" placeholder="Anthony Dela Cruz">
    </label>

    <label class="block mb-2">
      Email
      <input [(ngModel)]="email" type="email" class="block w-full border rounded-lg p-2" placeholder="anthony@school.ph">
    </label>

    <label class="block mb-4">
      Password
      <input [(ngModel)]="password" type="password" class="block w-full border rounded-lg p-2" placeholder="••••••••">
    </label>

    <!-- The red message when login / register fails. -->
    <p *ngIf="error" class="text-red-600 mb-4">{{ error }}</p>

    <button *ngIf="!isRegistering" (click)="login()" class="bg-black text-white px-4 py-2 rounded-full w-full font-bold">
      Log in
    </button>
    <button *ngIf="isRegistering" (click)="register()" class="bg-black text-white px-4 py-2 rounded-full w-full font-bold">
      Register
    </button>

    <button (click)="isRegistering = !isRegistering" class="underline text-[#ff6b1a] font-bold mt-3">
      {{ isRegistering ? 'Back to login' : 'No account yet? Register' }}
    </button>
  </div>
</div>
